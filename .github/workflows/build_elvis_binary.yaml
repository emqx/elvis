name: Build and upload

on:
  push:
    tags:
      - '*-emqx-*'  # Push events matching v*. e.g 1.0.0-emqx-1

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: |
          docker info
          docker run --rm -v "$(pwd):/src" --workdir /src erlang:28 rebar3 escriptize
          sudo mv _build/default/bin/elvis .
      - name: Create release and upload binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./elvis \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF" \
            --notes "" \
            --prerelease=false
